# movies-quarkus with a PVC mounted at /data (used by /api/v1/storage/files).
# Based on the Helm chart in https://github.com/rh-bcordeir/movies-quarkus-devops
# Apply with: oc apply -n <namespace> -f k8s/deployment-pvc.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movies-quarkus-data
  labels:
    app.kubernetes.io/name: movies-quarkus
    app.kubernetes.io/instance: movies-quarkus
    app.kubernetes.io/part-of: movies-quarkus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <storage-class>   # omitted = cluster default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-quarkus
  labels:
    app.kubernetes.io/name: movies-quarkus
    app.kubernetes.io/instance: movies-quarkus
    app.kubernetes.io/part-of: movies-quarkus
spec:
  replicas: 1
  # RWO volume: the old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: movies-quarkus
      app.kubernetes.io/instance: movies-quarkus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: movies-quarkus
        app.kubernetes.io/instance: movies-quarkus
    spec:
      containers:
        - name: app
          image: quay.io/rh-ee-bcordeir/movies-quarkus:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: STORAGE_PATH
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: movies-quarkus-data
---
apiVersion: v1
kind: Service
metadata:
  name: movies-quarkus
  labels:
    app.kubernetes.io/name: movies-quarkus
    app.kubernetes.io/instance: movies-quarkus
    app.kubernetes.io/part-of: movies-quarkus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: movies-quarkus
    app.kubernetes.io/instance: movies-quarkus
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: movies-quarkus
  labels:
    app.kubernetes.io/name: movies-quarkus
    app.kubernetes.io/instance: movies-quarkus
    app.kubernetes.io/part-of: movies-quarkus
spec:
  to:
    kind: Service
    name: movies-quarkus
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
