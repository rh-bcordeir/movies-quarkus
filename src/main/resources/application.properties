# H2 in-memory datasource for local dev
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:moviesdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Directory where the PVC is mounted (override with STORAGE_PATH env var)
storage.path=/data
%dev.storage.path=target/storage
%test.storage.path=target/test-storage

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=Movies API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
